postgres:
  limits:
    process: 50
    query: 25
    conn_percent: 70
  alarm:
    enabled: true
  leader_switch_hook: "echo 'leader switch'"

mysql:
  process_limit: 50
  cluster:
    enabled: false
    size: 3
    check_table_day: "Sun"
    check_table_hour: "05:00"
    receive_queue_limit: 10
    flow_control_limit: 0.20
  alarm:
    enabled: true

mongodb:
  uri: "mongodb://user:pass@localhost:27017/?replicaSet=rs0"
  connect_timeout_seconds: 5
  alarm:
    enabled: true
  limits:
    connections_percent: 80
    cache_percent: 95
  replicaset:
    enabled: true
    min_secondaries: 1
    lag_warn_seconds: 10
    lag_critical_seconds: 60
    oplog_window_warn_hours: 24
    oplog_window_critical_hours: 1
    primary_election_grace_seconds: 30
